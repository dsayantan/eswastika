<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swastika Watch · হিন্দুত্ব ২০২৬</title>
<meta name="description" content="Hindutva programs and propaganda lines in the RSS weekly Swastika, 2026, issue by issue, with links to the exact page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f1; --surface:#ffffff; --ink:#1d1b19; --muted:#6b6560; --line:#e4dfd8;
  --accent:#b3261e; --accent-soft:#fbe9e7; --chip:#efebe6; --auto:#8a5a00; --auto-soft:#fff4dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151413; --surface:#1f1d1b; --ink:#eeeae5; --muted:#a39d96; --line:#33302c;
    --accent:#ff8a80; --accent-soft:#3a1f1d; --chip:#2a2725; --auto:#f0c060; --auto-soft:#33291a;
  }
}
:root[data-theme="dark"]{
  --bg:#151413; --surface:#1f1d1b; --ink:#eeeae5; --muted:#a39d96; --line:#33302c;
  --accent:#ff8a80; --accent-soft:#3a1f1d; --chip:#2a2725; --auto:#f0c060; --auto-soft:#33291a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Noto Sans Bengali",system-ui,sans-serif}
.bn{font-family:"Noto Sans Bengali",Inter,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{padding:32px 0 16px}
h1{margin:0;font-size:28px;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;max-width:720px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:20px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:22px}
.stat small{color:var(--muted)}
button.stat{font:inherit;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
button.stat .go{margin-top:auto;padding-top:4px}
button.stat:hover{border-color:var(--accent)}
button.stat:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
button.stat[aria-pressed="true"] b{color:var(--accent)}
.stat .go{display:block;font-size:11.5px;color:var(--accent);margin-top:2px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.7;margin-left:4px}
.chip.feat{font-weight:600}
.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input[type=search],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=search]{flex:1;min-width:180px}
.more{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:6px 4px}
main{padding:16px 0 48px}
.month{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:start}
.date{font-weight:600;font-size:14px}
.date small{display:block;color:var(--muted);font-weight:400}
.head{font-size:17px;font-weight:600;line-height:1.4;margin:0}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.note{font-size:13.5px;margin-top:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:12.5px}
.tag.other{background:var(--chip);color:var(--ink)}
.tag.auto{background:var(--auto-soft);color:var(--auto)}
a.open{white-space:nowrap;text-decoration:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
a.open:hover{background:var(--accent);color:#fff}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{color:var(--muted);font-size:12.5px;padding:24px 0 40px;border-top:1px solid var(--line)}
.card>div{min-width:0}
.head,.note,.meta{overflow-wrap:anywhere}
.chip{max-width:100%}

nav.top{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
nav.top a{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px}
nav.top a[aria-current]{background:var(--accent);border-color:var(--accent);color:#fff}
a{color:var(--accent)}
h2{font-size:20px;margin:34px 0 10px;letter-spacing:-.01em}
.prose p{margin:0 0 12px;max-width:820px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.box h3{margin:0 0 4px;font-size:15.5px;line-height:1.35}
.box p{margin:6px 0 0;font-size:14px}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ref{font-size:12px;text-decoration:none;background:var(--chip);color:var(--ink);border-radius:6px;padding:2px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref:hover{background:var(--accent);color:#fff}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl div{margin-bottom:10px;max-width:820px}
.tl b{display:block;font-size:13px;color:var(--accent)}
.issue{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.issue>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:96px 1fr;gap:14px}
.issue>summary::-webkit-details-marker{display:none}
.issue .counts{color:var(--muted);font-size:12.5px;margin-top:4px}
.items{margin-top:12px;display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid var(--line);padding-top:8px;align-items:start}
.item .t{font-weight:600;font-size:14.5px}
.item .d{font-size:13.5px;margin-top:2px}
.item .m{color:var(--muted);font-size:12.5px}
a.pg{white-space:nowrap;text-decoration:none;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink)}
a.pg:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.disc{background:var(--auto-soft);color:var(--auto);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px;max-width:820px}
@media (max-width:640px){
  header{padding:24px 0 8px} h1{font-size:24px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .row2{flex-wrap:wrap} select{flex:1 1 40%;min-width:0}
  .issue>summary{grid-template-columns:minmax(0,1fr);gap:4px}
}

nav.top .sp{flex:1}
nav.top button.lg{font:inherit;font-size:13px;cursor:pointer;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px}
:lang(bn) body{font-family:"Noto Sans Bengali",Inter,system-ui,sans-serif}
</style>
</head>
<body>
<script src="lang.js"></script>
<div class="wrap">
  <header>
    <nav class="top" id="nav"></nav>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="stats" id="stats"></div>
    <p class="disc" id="disc"></p>
  </header>
  <section id="ov"></section>
  <h2 id="browse"></h2>
</div>
<div class="controls">
  <div class="wrap">
    <div class="chips" id="kinds"></div>
    <div class="row2">
      <input type="search" id="q">
      <select id="facet"></select>
      <select id="month"></select>
    </div>
  </div>
</div>
<div class="wrap">
  <main id="list"></main>
  <footer id="foot"></footer>
</div>
<script src="data/hindutva.js"></script>
<script>
(function(){
  const D = window.HINDUTVA || {overview:{}, issues:[]};
  const I = D.issues, O = D.overview || {};
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const $ = id => document.getElementById(id);
  document.title = T("স্বস্তিকা ওয়াচ · হিন্দুত্ব ২০২৬", "Swastika Watch · Hindutva 2026");
  $("nav").innerHTML = `<a href="index.html" aria-current="page">${T("হিন্দুত্ব ২০২৬","Hindutva 2026")}</a><a href="leaders.html">${T("সিপিআই(এম) নেতা","CPIM leaders")}</a><span class="sp"></span>` +
    `<button class="lg" onclick="setLang('${LANG==="bn"?"en":"bn"}')">${LANG==="bn"?"English":"বাংলা"}</button>`;
  $("h1").innerHTML = T("হিন্দুত্ব <span>২০২৬</span>", "Hindutva <span>2026</span>");
  $("sub").innerHTML = T(`আরএসএস-এর বাংলা সাপ্তাহিক <span class="bn">স্বস্তিকা</span>-র ২০২৬ সালের প্রতিটি সংখ্যায় আরএসএস ও তার শাখা সংগঠনগুলির কর্মসূচি এবং পত্রিকাটির প্রচারিত প্রোপাগান্ডা। প্রতিটি তথ্যের সঙ্গে <a href="https://www.eswastika.com/" target="_blank" rel="noopener">eswastika.com</a>-এ মূল পাতার লিঙ্ক দেওয়া আছে।`,
    `The programs the RSS and its affiliates ran, and the propaganda lines the RSS weekly <span class="bn">স্বস্তিকা</span> pushed, in every 2026 issue. Each entry links to the exact page on <a href="https://www.eswastika.com/" target="_blank" rel="noopener">eswastika.com</a>.`);
  $("disc").textContent = T("সারাংশগুলি পাতার ওসিআর লেখা থেকে এআই মডেল দিয়ে তৈরি, সবগুলি হাতে মিলিয়ে দেখা হয়নি। উদ্ধৃত করার আগে লিঙ্ক দেওয়া মূল পাতাটি দেখে নিন।",
    "Summaries were written by an AI model from OCR text of the pages and have not all been checked by hand. Check the linked page before quoting.");
  $("browse").textContent = T("সংখ্যা অনুযায়ী", "Issue by issue");
  $("q").placeholder = T("কর্মসূচি, জায়গা, শিরোনাম খুঁজুন…", "Search programs, places, headings…");
  $("q").setAttribute("aria-label", T("খুঁজুন", "Search"));

  const byId = Object.fromEntries(I.map(x => [x.issue, x]));
  const link = (issue, page) => `https://www.eswastika.com/${encodeURIComponent(issue)}.pdf#page=${+page || 1}`;
  const pujaName = id => { const s = id.replace("puja2026", ""); return T("পূজা সংখ্যা" + (s ? " " + ({a:"ক",b:"খ",c:"গ",d:"ঘ"}[s] || s) : ""), "Puja special" + (s ? " " + s.toUpperCase() : "")); };
  const day = (iso, o) => new Date(iso + "T00:00:00").toLocaleDateString(LOC, o);
  const issueName = id => { const x = byId[id]; if (!x) return id; return x.label ? pujaName(id) : day(x.date, {day:"numeric", month:"short"}); };
  const pg = p => T("পৃ. ", "p. ") + NUM(p);
  const refs = rs => (rs || []).map(r => `<a class="ref" target="_blank" rel="noopener" href="${link(r.issue, r.page)}" title="${esc(r.heading || "")}">${esc(issueName(r.issue))} · ${pg(r.page)}${r.heading ? ` · <span class="bn">${esc(r.heading)}</span>` : ""}</a>`).join("");

  const nP = I.reduce((a, x) => a + x.programs.length, 0), nN = I.reduce((a, x) => a + x.narratives.length, 0);
  $("stats").innerHTML =
    `<div class="stat"><b>${NUM(I.length)}</b><small>${T("২০২৬-এর সংখ্যা","issues of 2026")}</small></div>` +
    `<div class="stat"><b>${NUM(nP)}</b><small>${T("কর্মসূচির খবর","programs reported")}</small></div>` +
    `<div class="stat"><b>${NUM(nN)}</b><small>${T("প্রোপাগান্ডার লাইন","propaganda lines logged")}</small></div>`;

  let h = "";
  if (O.summary) h += `<h2>${T("এখনও পর্যন্ত বছরটি","The year so far")}</h2><div class="prose">${L(O,"summary").map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
  if (O.campaigns) h += `<h2>${T("প্রধান কর্মসূচি ও অভিযান","Major programs and campaigns")}</h2><div class="grid">${O.campaigns.map(c =>
    `<div class="box"><div class="kind">${esc(L(c,"org"))}</div><h3>${esc(L(c,"name"))}</h3><p>${esc(L(c,"description"))}</p><div class="refs">${refs(c.refs)}</div></div>`).join("")}</div>`;
  if (O.propaganda) h += `<h2>${T("পত্রিকার প্রচারিত প্রোপাগান্ডা","Propaganda lines the paper pushed")}</h2><div class="grid">${O.propaganda.map(c =>
    `<div class="box"><div class="kind">${esc(L(c,"theme"))}</div><h3>“${esc(L(c,"line"))}”</h3><p>${esc(L(c,"how"))}</p><div class="refs">${refs(c.refs)}</div></div>`).join("")}</div>`;
  if (O.timeline) h += `<h2>${T("মাস অনুযায়ী","Month by month")}</h2><div class="tl">${O.timeline.map(t => `<div><b>${esc(L(t,"month"))}</b>${esc(L(t,"highlights"))}</div>`).join("")}</div>`;
  $("ov").innerHTML = h;

  const state = {kind: "all", q: "", facet: "", month: ""};
  const kinds = [["all", T("সব","Everything")], ["programs", T("কর্মসূচি","Programs")], ["narratives", T("প্রোপাগান্ডা","Propaganda")]];
  function chips(){
    const el = $("kinds");
    el.innerHTML = kinds.map(([v,l]) => `<button class="chip" data-v="${v}" aria-pressed="${state.kind===v}">${l}</button>`).join("");
    el.querySelectorAll(".chip").forEach(b => b.onclick = () => { state.kind = b.dataset.v; state.facet = ""; chips(); facets(); render(); });
  }
  // facet values are the English keys; labels shown in the chosen language
  function count(key, arr){ const c = {}; I.forEach(x => x[arr].forEach(it => { const k = it[key] || "other"; c[k] = c[k] || {n:0, label: L(it, key) || k}; c[k].n++; })); return Object.entries(c).sort((a,b)=>b[1].n-a[1].n); }
  function facets(){
    const opt = (key, [k, v]) => `<option value="${key}:${esc(k)}">${esc(v.label)} (${NUM(v.n)})</option>`;
    let o = `<option value="">${T("সব সংগঠন ও বিষয়","All organisations &amp; themes")}</option>`;
    if (state.kind !== "narratives") o += `<optgroup label="${T("কর্মসূচির ধরন","Program type")}">${count("type","programs").map(e => opt("type", e)).join("")}</optgroup>` +
      `<optgroup label="${T("সংগঠন","Organisation")}">${count("org","programs").filter(e => e[1].n > 1).map(e => opt("org", e)).join("")}</optgroup>`;
    if (state.kind !== "programs") o += `<optgroup label="${T("প্রোপাগান্ডার বিষয়","Propaganda theme")}">${count("theme","narratives").map(e => opt("theme", e)).join("")}</optgroup>`;
    $("facet").innerHTML = o; $("facet").value = state.facet;
  }
  const months = [...new Set(I.map(x => x.label ? "puja" : x.date.slice(0,7)))].sort().reverse();
  $("month").innerHTML = `<option value="">${T("সব মাস","All months")}</option>` + months.map(m => `<option value="${m}">${m === "puja" ? T("পূজা সংখ্যা","Puja specials") : day(m + "-01", {month:"long"})}</option>`).join("");

  function match(it){
    if (state.facet){ const [k, v] = state.facet.split(/:(.*)/s); if ((it[k] || "other") !== v) return false; }
    if (!state.q) return true;
    return Object.values(it).join(" ").toLowerCase().includes(state.q);
  }
  function render(){
    state.q = $("q").value.trim().toLowerCase();
    let out = "";
    I.forEach(x => {
      if (state.month && (x.label ? "puja" : x.date.slice(0,7)) !== state.month) return;
      const ps = state.kind === "narratives" ? [] : x.programs.filter(match);
      const ns = state.kind === "programs" ? [] : x.narratives.filter(match);
      const filtered = state.q || state.facet;
      if (filtered && !ps.length && !ns.length) return;
      const items = ps.map(p => `<div class="item"><div><div class="kind">${T("কর্মসূচি","Program")} · ${esc(L(p,"org"))} · ${esc(L(p,"type"))}</div><div class="t">${esc(L(p,"title"))}</div>
          <div class="m">${[L(p,"where"), L(p,"when")].filter(Boolean).map(esc).join(" · ")}</div><div class="d">${esc(L(p,"detail"))}</div></div>
          <a class="pg" target="_blank" rel="noopener" href="${link(x.issue, p.page)}">${pg(p.page)} ↗</a></div>`).join("") +
        ns.map(n => `<div class="item"><div><div class="kind">${T("প্রোপাগান্ডা","Propaganda")} · ${esc(L(n,"theme"))}</div><div class="t bn">${esc(n.heading)}</div>
          <div class="d">${esc(L(n,"claim"))}</div><div class="m">${T("লক্ষ্য","Target")}: ${esc(L(n,"target"))}</div></div>
          <a class="pg" target="_blank" rel="noopener" href="${link(x.issue, n.page)}">${pg(n.page)} ↗</a></div>`).join("");
      out += `<details class="issue" ${filtered ? "open" : ""}><summary><div class="date">${x.label ? esc(pujaName(x.issue)) : day(x.date, {day:"numeric", month:"short"})}<small>${x.label ? esc(x.issue) : NUM(x.date.slice(0,4))}</small></div>
        <div><div>${esc(L(x,"summary"))}</div><div class="counts">${NUM(ps.length)} ${T("কর্মসূচি","programs")} · ${NUM(ns.length)} ${T("প্রোপাগান্ডা","propaganda lines")}${filtered ? T(" মিলেছে"," match") : ""} · <a href="${link(x.issue,1)}" target="_blank" rel="noopener">${T("পুরো সংখ্যা","open issue")} ↗</a></div></div></summary>
        <div class="items">${items}</div></details>`;
    });
    $("list").innerHTML = out || `<p class="empty">${T("এই ফিল্টারে কিছু পাওয়া যায়নি।","Nothing matches these filters.")}</p>`;
  }
  $("q").oninput = render;
  $("facet").onchange = e => { state.facet = e.target.value; render(); };
  $("month").onchange = e => { state.month = e.target.value; render(); };
  $("foot").innerHTML = T(`হালনাগাদ ${esc(day(D.generated, {day:"numeric", month:"long", year:"numeric"}))}। প্রতি রবিবার নতুন সংখ্যা ডাউনলোড, ওসিআর ও সারাংশ করে যোগ করা হয় এবং বছরের সারসংক্ষেপ নতুন করে লেখা হয়। লিঙ্কগুলি eswastika.com-এ মূল পিডিএফের নির্দিষ্ট পাতা খোলে।`,
    `Updated ${esc(D.generated)}. New issues are added every Sunday: they are downloaded, OCR'd and summarised, and the year overview is rewritten. Links open the original PDF on eswastika.com at the page shown.`);
  chips(); facets(); render();
})();
</script>
</body>
</html>
